name: montotem
description: "Application MONTOTEM - Service d'assistance et de dépannage au Bénin"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^18.1.4

  # HTTP
  dio: ^5.7.0
  http: ^1.3.0

  # Backend
  supabase_flutter: ^2.8.3

  # Support Web (requis par le SDK Kkiapay)
  web: ^1.1.1

  # Cartes & Géolocalisation
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_compass: ^0.8.1

  # Téléphone : validation / formatage E.164 (+229)
  phone_numbers_parser: ^9.0.3
  url_launcher: ^6.3.1

  # Stockage local et mode hors ligne
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.5
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  flutter_secure_storage: 11.2.0

  # NOUVEAU : niveau de batterie (bandeau d'alerte + mode éco)
  battery_plus: ^6.2.0

  # NOUVEAU : garde l'écran allumé pendant la balise lumineuse
  wakelock_plus: ^1.2.8

  # Internationalisation
  intl: ^0.20.2

  # Paiement
  kkiapay_flutter_sdk: ^1.3.4

  # Notifications
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^4.0.4
  image: ^4.12.0
  google_mlkit_face_detection: ^0.15.1

  # Divers
  flutter_dotenv: ^6.0.1
  flutter_phone_direct_caller: ^2.2.1
  google_fonts: ^9.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  freezed: ^4.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/emergency_numbers.json
    - assets/.env
    - assets/images/