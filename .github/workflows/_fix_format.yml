name: Format jetable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: dart format lib test
      - name: Commit format
        run: |
          git config user.name "montotem-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: dart format (rattrapage automatique)"
          git push
