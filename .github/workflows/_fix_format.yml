name: _fix_format
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
      - run: dart format lib test
      - name: Commit format
        run: |
          git config user.name "montotem-bot"
          git config user.email "bot@montotem.app"
          git add -A
          git diff --cached --quiet || git commit -m "style: dart format (rattrapage automatique)"
          git push
