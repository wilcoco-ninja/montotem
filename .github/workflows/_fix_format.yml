name: Format fix (jetable)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format lib test
      - run: |
          git config user.name "montotem-bot"
          git config user.email "bot@montotem.local"
          git add -A
          git diff --cached --quiet || git commit -m "style: dart format (rattrapage automatique)"
          git push
