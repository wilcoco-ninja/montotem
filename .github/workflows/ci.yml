name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests (dont architecture)
        run: flutter test

      - name: Secrets dans le dépôt
        run: |
          if git grep -n -I -E "service_role|sk_live_|sk_test_|R2_SECRET_ACCESS_KEY|R2_ACCESS_KEY_ID|R2_ACCOUNT_ID|SUPABASE_SERVICE_ROLE_KEY" -- lib android ios web assets ':!*.md' ':!web/canvaskit*'; then
            echo "::error::Secret potentiel détecté"
            exit 1
          fi
          if git ls-files | grep -E '^env/.*\.json$' | grep -v '\.example\.json$'; then
            echo "::error::Fichier d'environnement suivi par Git"
            exit 1
          fi
